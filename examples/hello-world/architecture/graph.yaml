# One authored graph. Logical modules are ownership groups, not separate files.
schemaVersion: "1"
id: graph:hello-world
title: Hello-world architecture
description: Greeting CLI, service, and formatting semantics; excludes
  persistence and network. Localization is not yet decided.
nodes:
  - id: surface:cli
    kind: surface
    name: Greeting interface
    description: Accept a name and print the greeting without rebuilding its text.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/cli.js
    module: module:interface
  - id: component:greeter
    kind: component
    name: Greeting service
    description: Provide the greeting capability by calling the formatter.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
    module: module:greetings
  - id: capability:greet
    kind: capability
    name: Greet a person
    description: Return a greeting for a supplied name.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
    module: module:greetings
  - id: component:formatter
    kind: component
    name: Formatter
    description: Determine greeting text and normalize blank names to world.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/formatter.js
    module: module:greetings
  - id: contract:greeting
    kind: contract
    name: Greeting format
    description: Trim names; empty names become world. Friendly returns Hello,
      NAME!; formal returns Good day, NAME. Reject unsupported tones.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/formatter.js
    module: module:greetings
  - id: boundary:presentation
    kind: boundary
    name: Presentation boundary
    description: The CLI must consume greeting text without independently reconstructing it.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/cli.js
    module: module:interface
  - id: decision:tone
    kind: decision
    name: Greeting tone
    description: "Resolved: friendly remains the default; explicit formal tone is
      supported and unsupported tones are rejected."
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/formatter.js
    module: module:greetings
  - id: decision:localization
    kind: decision
    name: Localization
    description: Whether to localize greetings is unresolved; localization is
      excluded from this implementation.
    status: unresolved
    references:
      - kind: design
        path: requirements.md
    module: module:greetings
relationships:
  - id: relationship:provides
    kind: provides
    from: component:greeter
    to: capability:greet
    description: The service provides greeting behavior.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
  - id: relationship:cli-calls
    kind: depends_on
    from: surface:cli
    to: component:greeter
    description: The interface delegates greeting creation.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/cli.js
  - id: relationship:formats
    kind: depends_on
    from: component:greeter
    to: component:formatter
    description: The service delegates text semantics to the formatter.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
  - id: relationship:authority
    kind: authority_for
    from: component:formatter
    to: contract:greeting
    description: The formatter determines greeting text semantics.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/formatter.js
  - id: relationship:preserves
    kind: preserves
    from: component:greeter
    to: contract:greeting
    description: Preserve the formatting result.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
  - id: relationship:boundary
    kind: constrained_by
    from: surface:cli
    to: boundary:presentation
    description: Do not reconstruct text in the CLI.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/cli.js
  - id: relationship:tone
    kind: affects
    from: decision:tone
    to: contract:greeting
    description: The accepted tone choice extends the format contract with an
      explicit formal variant.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/formatter.js
  - id: relationship:owns-greeting
    kind: owns
    from: component:greeter
    to: capability:greet
    description: The greeting service owns delivery of the greeting capability.
    status: implemented
    references:
      - kind: design
        path: requirements.md
      - kind: implementation
        path: src/greeter.js
  - id: relationship:localization
    kind: affects
    from: decision:localization
    to: contract:greeting
    description: Localization would require a separate contract decision.
    status: unresolved
    references:
      - kind: design
        path: requirements.md
modules:
  - id: module:interface
    name: Greeting interface
    description: Accept input and display the returned greeting.
    exports: []
    imports:
      - component:greeter
  - id: module:greetings
    name: Greeting behavior
    description: Own greeting delivery and the single formatting authority.
    exports:
      - component:greeter
    imports: []
