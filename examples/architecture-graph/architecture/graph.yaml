        path: src/artifacts.ts
      - kind: implementation
        path: test/toolkit.test.js
  - id: relationship:generator-proof
    kind: constrained_by
    from: component:artifact-generator
    to: boundary:declarations-not-proof
    description: Drift compares derived records only; code-only behavior changes can leave check green.
    status: implemented
    references:
      - kind: implementation
        path: src/artifacts.ts
      - kind: implementation
        path: test/consumer.mjs
  - id: relationship:entrypoints-project
    kind: depends_on
