        path: docs/development.md
  - id: relationship:human-api
    kind: affects
    from: decision:human-ownership
    to: contract:public-operations
    description: Public interface review responsibility is not assigned to a named person in this model.
    status: unresolved
    references:
      - kind: design
        path: docs/development.md
modules:
  - id: module:declarations
    name: Declarations and validity
    description: Owns authored meaning, project loading and structural checks. Exposes validated project
      snapshots, format/module contracts and file/proof boundaries.
    exports:
      - boundary:declarations-not-proof
      - boundary:project-local-files
      - capability:load-project
      - component:declaration-model
      - component:project-loader
      - contract:authored-format
    imports:
      - component:lookup-indexes
  - id: module:context
    name: Indexes and focused context
    description: Owns disposable lookup indexes and bounded retrieval. Imports validated project
      snapshots; exports context capability and index construction for loading/generation.
    exports:
      - capability:retrieve-context
      - component:lookup-indexes
    imports:
      - capability:load-project
      - component:artifact-generator
      - component:project-loader
  - id: module:interfaces
    name: Public interfaces and guidance
    description: Owns CLI/library entrypoints and generated guidance/drift. Coordinates declarations,
      context and installation without redefining their semantics.
    exports:
      - capability:maintain-guidance
      - component:artifact-generator
      - component:public-entrypoints
      - contract:public-operations
    imports:
      - boundary:declarations-not-proof
      - boundary:project-local-files
      - capability:install-agent-skill
      - capability:load-project
      - capability:retrieve-context
      - component:lookup-indexes
  - id: module:delivery
    name: Agent adoption and distribution
    description: Owns shared skill installation, build/package delivery and adoption decisions. Imports
      public operations, schema authority, maintenance capabilities and project boundaries.
    exports:
      - capability:install-agent-skill
    imports:
      - boundary:declarations-not-proof
      - boundary:project-local-files
      - capability:maintain-guidance
      - capability:retrieve-context
      - component:declaration-model
      - component:public-entrypoints
      - contract:authored-format
      - contract:public-operations
