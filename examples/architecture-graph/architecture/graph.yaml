        path: skills/architecture-graph/SKILL.md
  - id: relationship:build-model
    kind: depends_on
    from: component:build-release
    to: component:declaration-model
    description: Build emits JSON schemas from Zod definitions so packaged machine contracts share one source.
    status: implemented
